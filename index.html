<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>小众点评必吃榜单</title>
  <style>
    :root{--ink:#2c2823;--muted:#7d776e;--paper:#f5f0e7;--card:#fffdf8;--line:#ddd4c7;--orange:#b56f45;--orange2:#e9c1a5;--blue:#6588a2;--blue2:#dbe8ed;--red:#c95e66;--red2:#f5dadd;--green:#657f6b;--shadow:0 18px 50px rgba(64,48,34,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .wrap{width:min(1180px,calc(100% - 40px));margin:auto}.topbar{position:sticky;top:0;z-index:30;background:rgba(245,240,231,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(221,212,199,.8)}.topbar .wrap{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.08em}.actions{display:flex;gap:10px}.btn{border:0;border-radius:999px;padding:11px 17px;background:#ece4d8;font-weight:700;transition:.2s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--ink);color:white}.btn.orange{background:var(--orange);color:white}.btn.ghost{background:transparent;border:1px solid var(--line)}.symbol{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:6px;border-radius:50%;background:rgba(255,255,255,.55);color:var(--orange);font-weight:900}
    .hero{padding:74px 0 34px;text-align:center}.eyebrow{color:var(--orange);font-size:12px;letter-spacing:.2em;font-weight:800}.hero h1{font:700 clamp(38px,6vw,70px)/1.05 Georgia,"Songti SC",serif;margin:18px auto 20px;max-width:820px}.hero p{color:var(--muted);font-size:17px;line-height:1.8;margin:0 auto 28px;max-width:680px}.natural{display:flex;gap:10px;padding:8px;background:rgba(255,253,248,.82);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);max-width:760px;margin:auto}.natural input{flex:1;min-width:0;border:0;background:transparent;padding:12px 16px;outline:none;font-size:16px}.interpret{max-width:760px;margin:12px auto 0;text-align:left;background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:none;align-items:center;gap:12px}.interpret.show{display:flex}.interpret p{margin:0;flex:1;font-size:14px;line-height:1.5}.interpret strong{color:var(--orange)}
    .filterPanel{margin:28px auto 58px;padding:22px;background:rgba(255,253,248,.72);border:1px solid var(--line);border-radius:26px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px 4px}.field select,.field input,.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fffdf8;padding:12px 14px;outline:none}.field select:focus,.field input:focus,.modal input:focus,.modal textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(181,111,69,.12)}.filters .btn{align-self:end;height:45px}
    .sectionHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.sectionHead h2{font:700 30px Georgia,"Songti SC",serif;margin:0}.sectionHead p{margin:7px 0 0;color:var(--muted)}.summary{color:var(--orange);font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:80px}.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 8px 28px rgba(60,47,34,.055);transition:.25s}.card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.visual{position:relative;aspect-ratio:1.2/1;overflow:hidden;background:#e7dfd3}.dishImage{position:absolute;inset:0;background-repeat:no-repeat;background-size:300% 300%;filter:saturate(.72) contrast(.93) brightness(1.04);transform:scale(1.015)}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,35,28,.25),transparent 34%,rgba(42,35,28,.08))}.place{position:absolute;z-index:2;top:18px;left:18px;color:white;text-shadow:0 2px 15px rgba(0,0,0,.35)}.city{font:700 24px Georgia,"Songti SC",serif;display:flex;align-items:center;gap:7px}.pin{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(185,91,72,.93);font-family:Arial}.district{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:rgba(89,132,157,.93);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;text-shadow:none}.number{position:absolute;z-index:2;right:18px;top:18px;background:rgba(255,253,248,.86);backdrop-filter:blur(8px);padding:7px 10px;border-radius:999px;font:700 12px Georgia;color:var(--ink)}.dishName{position:absolute;z-index:2;left:18px;bottom:16px;background:rgba(255,253,248,.92);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800}.body{padding:19px}.tag{display:inline-block;color:var(--orange);background:#f3e2d4;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.body h3{font:700 23px/1.25 Georgia,"Songti SC",serif;margin:13px 0 8px}.area{font-size:13px;color:var(--blue);font-weight:700}.reason{color:#635d54;line-height:1.7;height:3.4em;overflow:hidden;margin:13px 0 18px}.cardBottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee6db;padding-top:14px}.reactions,.cardTools{display:flex;gap:7px}.iconBtn{position:relative;border:0;border-radius:999px;min-width:38px;height:38px;padding:0 10px;background:#eee7dc;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-weight:800;transition:.2s}.iconBtn:hover{transform:translateY(-2px)}.iconBtn.like{background:var(--red2);color:var(--red)}.iconBtn.dislike{background:var(--blue2);color:var(--blue)}.iconBtn.map{background:#dfe8df;color:var(--green)}.iconBtn.edit{background:#eee3d4;color:#9d6c3c}.iconBtn.delete{background:#f1dfdf;color:#a65353}.burst{position:absolute;left:50%;top:-18px;pointer-events:none;color:var(--red);font-weight:900;animation:float .85s ease-out forwards}@keyframes float{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}35%{opacity:1;transform:translate(-50%,-4px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-28px) scale(.9)}}
    .empty{text-align:center;padding:70px 20px;background:#fffdf8;border:1px dashed var(--line);border-radius:24px;grid-column:1/-1}.empty h3{font:700 24px Georgia;margin:0 0 10px}.empty p{color:var(--muted)}
    .overlay{position:fixed;z-index:60;inset:0;background:rgba(35,30,25,.45);backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:28px;padding:28px;box-shadow:0 30px 80px rgba(20,16,12,.28)}.modal.wide{width:min(820px,100%)}.modalHead{display:flex;justify-content:space-between;align-items:start;gap:20px}.modal h2{font:700 30px Georgia,"Songti SC",serif;margin:0}.close{border:0;background:#eee7dc;width:38px;height:38px;border-radius:50%;font-size:20px}.detailVisual{margin:20px 0;aspect-ratio:1.8/1;border-radius:22px;position:relative;overflow:hidden;background:#eee}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.detailBlock{background:#f4eee5;border-radius:18px;padding:16px}.detailBlock.full{grid-column:1/-1}.detailBlock small{display:block;color:var(--muted);margin-bottom:7px}.detailBlock p{margin:0;line-height:1.7}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.modal label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px 3px}.modal textarea{min-height:110px;resize:vertical}.span2{grid-column:1/-1}.error{color:#a43e48;background:#f5dadd;border-radius:12px;padding:10px 12px;font-size:13px;display:none}.error.show{display:block}.modalActions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;z-index:100;left:50%;bottom:24px;transform:translateX(-50%) translateY(25px);opacity:0;background:var(--ink);color:white;padding:12px 18px;border-radius:999px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters .btn{grid-column:1/-1}.hero{padding-top:50px}}
    @media(max-width:620px){.wrap{width:min(100% - 24px,1180px)}.topbar .wrap{height:64px}.brand{font-size:15px}.actions .btn{padding:9px 11px}.actions .label{display:none}.hero h1{font-size:42px}.natural{flex-direction:column;border-radius:20px}.interpret.show{align-items:flex-start;flex-wrap:wrap}.grid{grid-template-columns:1fr}.filters,.formGrid,.detailGrid{grid-template-columns:1fr}.span2,.detailBlock.full{grid-column:auto}.sectionHead{align-items:start;flex-direction:column;gap:8px}.modal{padding:22px}.visual{aspect-ratio:1.3/1}}
  </style>
</head>
<body>
  <header class="topbar"><div class="wrap"><div class="brand">NICHE BITES · 小众点评</div><div class="actions"><button class="btn ghost" id="reset"><span class="symbol">↻</span><span class="label">重置</span></button><button class="btn orange" id="add"><span class="symbol">＋</span><span class="label">新增美食</span></button></div></div></header>
  <main>
    <section class="hero wrap"><div class="eyebrow">A SMALL GUIDE TO GREAT FOOD</div><h1>去陌生的地方，也能吃到真正值得的一餐。</h1><p>说说你想吃什么、在哪座城市或哪个区域。也可以什么都不选，慢慢逛完整榜单。</p><form class="natural" id="naturalForm"><input id="naturalInput" placeholder="例如：想找深圳南山区的甜品"><button class="btn primary">帮我理解</button></form><div class="interpret" id="interpret"><p>我理解你想找：<strong id="interpretText"></strong>。确认后再为你筛选。</p><button class="btn orange" id="confirm" type="button">确认</button><button class="btn ghost" id="reject" type="button">重新说</button></div></section>
    <section class="wrap filterPanel"><form class="filters" id="filterForm"><div class="field"><label>想吃什么</label><select id="foodFilter"><option value="">全部美食</option></select></div><div class="field"><label>所在城市</label><select id="cityFilter"><option value="">全部城市</option></select></div><div class="field"><label>所在区</label><select id="districtFilter"><option value="">全部区域</option></select></div><button class="btn primary">查询美食</button></form></section>
    <section class="wrap" id="results"><div class="sectionHead"><div><h2>本期必吃清单</h2><p id="resultCopy">默认展示全部店铺</p></div><div class="summary" id="summary"></div></div><div class="grid" id="grid"></div></section>
  </main>
  <div class="overlay" id="detailOverlay"><div class="modal wide" id="detailModal"></div></div>
  <div class="overlay" id="editOverlay"><form class="modal" id="editForm"><div class="modalHead"><h2 id="formTitle">新增美食</h2><button class="close" type="button" data-close>×</button></div><div class="formGrid"><div><label>店名 *</label><input name="name"></div><div><label>想吃什么 *</label><input name="food"></div><div><label>所在城市 *</label><input name="city"></div><div><label>所在区 *</label><input name="district"></div><div class="span2"><label>推荐理由 *</label><textarea name="reason"></textarea></div><div><label>推荐人 *</label><input name="recommender"></div><div><label>地图链接 *</label><input name="mapLink" placeholder="https://..."></div><div class="span2 error" id="formError"></div></div><div class="modalActions"><button class="btn ghost" type="button" data-close>取消</button><button class="btn orange">保存美食</button></div></form></div>

    const KEY='niche-bites-standalone-v1';
    let foods=loadFoods(),filters={food:'',city:'',district:''},candidate=null,editing=null,burst=null;
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const displayCity=s=>!s||s.endsWith('市')||s==='香港'||s==='顺德'?s:s+'市';
    const displayDistrict=s=>!s||s.endsWith('区')||s.endsWith('县')?s:s+'区';
    function loadFoods(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch{return structuredClone(SEED)}}
    function saveFoods(){try{localStorage.setItem(KEY,JSON.stringify(foods))}catch{} }
    function visualFor(x){return VISUALS[x.id]||{dish:x.food||'本店代表菜',sheet:'c',cell:7,exact:false}}
    function pos(cell){return (cell%3)*50+'% '+Math.floor(cell/3)*50+'%'}
    function summary(f){return [displayCity(f.city),displayDistrict(f.district),f.food].filter(Boolean).join(' · ')}
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el.t);el.t=setTimeout(()=>el.classList.remove('show'),2200)}
    function fillSelect(id,values){const el=$(id),current=el.value;el.innerHTML='<option value="">'+(id==='#foodFilter'?'全部美食':id==='#cityFilter'?'全部城市':'全部区域')+'</option>'+[...new Set(values)].sort().map(v=>'<option>'+escape(v)+'</option>').join('');el.value=current}
    function renderOptions(){fillSelect('#foodFilter',foods.map(x=>x.food));fillSelect('#cityFilter',foods.map(x=>x.city));fillSelect('#districtFilter',foods.map(x=>x.district))}
    function render(){renderOptions();const match=(v,q)=>String(v).toLowerCase().includes(q.trim().toLowerCase());const list=foods.filter(x=>(!filters.food||match(x.food+' '+x.name+' '+x.reason,filters.food))&&(!filters.city||match(x.city,filters.city))&&(!filters.district||match(x.district+' '+(x.area||''),filters.district)));$('#summary').textContent=summary(filters);$('#resultCopy').textContent=Object.values(filters).some(Boolean)?'找到 '+list.length+' 家符合条件的店':'默认展示全部 '+list.length+' 家店铺';$('#grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><h3>暂时没有找到对应店铺</h3><p>可以减少一个筛选条件，或新增一条你知道的美食。</p></div>';}
    function card(x){const v=visualFor(x);return '<article class="card" data-id="'+x.id+'"><div class="visual" data-open><div class="dishImage" style="background-image:url('+SHEETS[v.sheet]+');background-position:'+pos(v.cell)+'"></div><div class="place"><div class="city"><span class="pin">●</span>'+escape(displayCity(x.city))+'</div><div class="district"><span>▦</span>'+escape(displayDistrict(x.district))+'</div></div><div class="number">NO. '+String(x.id).padStart(2,'0')+'</div><div class="dishName">'+escape(v.dish)+'</div></div><div class="body"><span class="tag">'+escape(x.food)+'</span><h3 data-open>'+escape(x.name)+'</h3><div class="area">'+escape(x.area||x.district)+'</div><p class="reason">'+escape(x.reason)+'</p><div class="cardBottom"><div class="reactions"><button class="iconBtn like" data-like title="点赞">♥ <span>'+x.likes+'</span>'+(burst&&burst.id===x.id&&burst.kind==='like'?'<i class="burst">＋1</i>':'')+'</button><button class="iconBtn dislike" data-dislike title="不推荐">♡ <span>'+x.dislikes+'</span>'+(burst&&burst.id===x.id&&burst.kind==='dislike'?'<i class="burst">＋1</i>':'')+'</button></div><div class="cardTools"><a class="iconBtn map" href="'+escape(x.mapLink)+'" target="_blank" title="打开地图">⌖</a><button class="iconBtn edit" data-edit title="编辑">✎</button><button class="iconBtn delete" data-delete title="删除">⌫</button></div></div></div></article>'}
    function understand(raw){const clean=raw.replace(/[\s，,。.!！?？、—-]/g,'').toLowerCase(),pick=(values,suffixes=[])=>[...new Set(values)].sort((a,b)=>b.length-a.length).find(v=>[v,...suffixes.map(s=>v.endsWith(s)?v.slice(0,-s.length):v)].some(f=>f&&clean.includes(f.toLowerCase())))||'';const f={city:pick(foods.map(x=>x.city),['市']),district:pick(foods.map(x=>x.district),['区','县']),food:pick(foods.map(x=>x.food))};return Object.values(f).some(Boolean)?f:null}
    function syncFilters(){for(const k of ['food','city','district'])$('#'+k+'Filter').value=filters[k]||''}
    $('#naturalForm').addEventListener('submit',e=>{e.preventDefault();const raw=$('#naturalInput').value.trim();candidate=raw?understand(raw):null;if(!candidate){$('#interpret').classList.remove('show');toast(raw?'还没听懂，请换一种更具体的说法':'请先说说你想吃什么或在哪里');$('#naturalInput').focus();return}$('#interpretText').textContent=summary(candidate);$('#interpret').classList.add('show')});
    $('#confirm').onclick=()=>{filters={...candidate};syncFilters();$('#interpret').classList.remove('show');render();$('#results').scrollIntoView({behavior:'smooth'});candidate=null};
    $('#reject').onclick=()=>{$('#interpret').classList.remove('show');candidate=null;$('#naturalInput').focus()};
    $('#filterForm').addEventListener('submit',e=>{e.preventDefault();filters={food:$('#foodFilter').value,city:$('#cityFilter').value,district:$('#districtFilter').value};render();$('#results').scrollIntoView({behavior:'smooth'})});
    $('#reset').onclick=()=>{filters={food:'',city:'',district:''};$('#naturalInput').value='';candidate=null;$('#interpret').classList.remove('show');syncFilters();render();scrollTo({top:0,behavior:'smooth'});toast('已重置查询，重新展示全部店铺')};
    function react(id,kind){foods=foods.map(x=>x.id===id?{...x,[kind==='like'?'likes':'dislikes']:x[kind==='like'?'likes':'dislikes']+1}:x);burst={id,kind};saveFoods();render();setTimeout(()=>{burst=null;render()},850)}
    $('#grid').addEventListener('click',e=>{const card=e.target.closest('.card');if(!card)return;const id=Number(card.dataset.id);if(e.target.closest('[data-like]'))return react(id,'like');if(e.target.closest('[data-dislike]'))return react(id,'dislike');if(e.target.closest('[data-edit]'))return openEdit(id);if(e.target.closest('[data-delete]')){if(confirm('确认删除这家店吗？')){foods=foods.filter(x=>x.id!==id);saveFoods();render();toast('已删除这家店')}}else if(e.target.closest('[data-open]'))openDetail(id)});
    function openDetail(id){const x=foods.find(v=>v.id===id),v=visualFor(x),m=$('#detailModal');m.innerHTML='<div class="modalHead"><div><span class="tag">'+escape(x.food)+'</span><h2 style="margin-top:10px">'+escape(x.name)+'</h2></div><button class="close" data-close>×</button></div><div class="detailVisual"><div class="dishImage" style="background-image:url('+SHEETS[v.sheet]+');background-position:'+pos(v.cell)+'"></div><div class="dishName">特色菜 · '+escape(v.dish)+'</div></div><div class="detailGrid"><div class="detailBlock"><small>城市与区域</small><p>'+escape(displayCity(x.city))+' · '+escape(displayDistrict(x.district))+(x.area?' · '+escape(x.area):'')+'</p></div><div class="detailBlock"><small>推荐人</small><p>'+escape(x.recommender)+'</p></div><div class="detailBlock full"><small>推荐理由</small><p>'+escape(x.reason)+'</p></div></div><div class="modalActions"><button class="btn ghost" data-edit-detail>编辑</button><a class="btn orange" href="'+escape(x.mapLink)+'" target="_blank">打开地图</a></div>';m.dataset.id=id;$('#detailOverlay').classList.add('show')}
    $('#detailOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget||e.target.closest('[data-close]'))e.currentTarget.classList.remove('show');if(e.target.closest('[data-edit-detail]')){const id=Number($('#detailModal').dataset.id);e.currentTarget.classList.remove('show');openEdit(id)}});
    function openEdit(id=null){editing=id;const f=$('#editForm');f.reset();$('#formTitle').textContent=id?'编辑美食':'新增美食';$('#formError').classList.remove('show');if(id){const x=foods.find(v=>v.id===id);for(const n of ['name','food','city','district','reason','recommender','mapLink'])f.elements[n].value=x[n]||''}$('#editOverlay').classList.add('show')}
    $('#add').onclick=()=>openEdit();
    $('#editOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget||e.target.closest('[data-close]'))e.currentTarget.classList.remove('show')});
    $('#editForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget),item=Object.fromEntries(fd),err=$('#formError');if(Object.values(item).some(v=>!String(v).trim())){err.textContent='请把店名、想吃什么、城市、区域、推荐理由、推荐人和地图链接补充完整后再保存。';err.classList.add('show');return}try{const u=new URL(item.mapLink);if(!['http:','https:'].includes(u.protocol))throw 0}catch{err.textContent='地图链接需要以 http:// 或 https:// 开头。';err.classList.add('show');return}if(editing){foods=foods.map(x=>x.id===editing?{...x,...item}:x)}else{foods.unshift({...item,id:Math.max(0,...foods.map(x=>x.id))+1,area:'',location:item.name,likes:0,dislikes:0})}saveFoods();e.currentTarget.closest('.overlay').classList.remove('show');render();toast(editing?'已保存修改':'已新增美食')});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.overlay').forEach(x=>x.classList.remove('show'))});
    render();
  </script>
